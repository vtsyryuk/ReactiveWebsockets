name: SonarCloud Analysis

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'vtsyryuk' }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'vtsyryuk_ReactiveWebsockets' }}

jobs:
  verify:
    name: SonarCloud build and tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up scanner JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build, test, and generate JaCoCo coverage
        run: |
          ./gradlew clean build jacocoTestReport --no-daemon
      - name: Set up Python for administrative workflow tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Test administrative workflows and collect coverage
        run: |
          python -m pip install --only-binary :all: coverage==7.10.7 PyNaCl==1.6.2
          python -m coverage run --source=.github/scripts -m unittest discover -s .github/scripts -p test_bootstrap_sonar.py
          python -m coverage xml -o build/reports/python/coverage.xml
      - name: Upload scanner inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-inputs
          path: |
            build/classes/
            build/resources/
            build/reports/
            build/test-results/
          if-no-files-found: error
          retention-days: 1
      - name: Report analysis activation state
        shell: bash
        run: |
          if [ "$SONAR_ENABLED" != 'true' ]; then
            echo '### SonarCloud analysis is not activated' >> "$GITHUB_STEP_SUMMARY"
            echo 'Build/test verification ran. No SonarCloud analysis or quality gate ran. Complete .github/SONARCLOUD.md and set SONAR_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
          fi

  analysis:
    name: SonarCloud analysis and quality gate
    permissions:
      contents: read
      pull-requests: read
    needs: verify
    # Untrusted PRs still get build/test verification, without receiving a token.
    if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require analysis credentials
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SonarCloud is enabled but SONAR_TOKEN is missing. Add the repository secret; see .github/SONARCLOUD.md.'
            exit 1
          fi
      - name: Set up scanner JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Download scanner inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sonar-inputs
          path: build
      - name: Analyze and enforce the quality gate
        run: |
          ./gradlew sonar --no-daemon -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
