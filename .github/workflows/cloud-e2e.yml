name: Cloud E2E

on:
  deployment_status:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Cloud demo URL to test
        required: false
        default: https://reactivewebsockets.onrender.com

permissions:
  contents: read

jobs:
  cloud-ui:
    name: Run Cloud UI Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://reactivewebsockets.onrender.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Wait for cloud demo readiness
        run: |
          health_url="${PLAYWRIGHT_BASE_URL%/}/health"
          deadline=$((SECONDS + 300))
          attempt=1

          while (( SECONDS < deadline )); do
            echo "Readiness attempt ${attempt}: ${health_url}"
            response="$(curl --fail --silent --show-error --max-time 30 "${health_url}" || true)"
            if jq -e '.status == "ok"' <<<"${response}" >/dev/null 2>&1; then
              echo "Cloud demo is ready."
              exit 0
            fi

            attempt=$((attempt + 1))
            sleep 5
          done

          echo "::error::Cloud demo did not become ready within 5 minutes."
          exit 1

      - name: Run cloud UI tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-e2e-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
